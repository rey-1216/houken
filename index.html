<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放送研究会 出欠</title>
<meta name="description" content="活動日の出欠をここから回答してください">
<meta property="og:title" content="放送研究会 出欠">
<meta property="og:description" content="活動日の出欠をここから回答してください">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#18202C; --sub:#5C6778; --line:#D5DBE3;
  --live:#E0362C; --event:#5B43C9; --prep:#B97A0A; --pick:#2B5FB8;
  --ok:#1E8A5A; --late:#C27C0E; --no:#8A93A3; --tbd:#9AA3B2;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121722; --panel:#1B2230; --ink:#E7EBF2; --sub:#9AA5B8; --line:#2E3747;
    --live:#FF5A4E; --event:#9C87FF; --prep:#E3A73A; --pick:#6C9BEF;
    --ok:#45C08A; --late:#E8A43A; --no:#7E889A; --tbd:#6E788A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding-bottom:84px}
header{background:var(--ink);color:var(--bg);padding:14px 16px 0}
header h1{margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:.04em}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:transparent;color:inherit;opacity:.6;font:inherit;font-weight:700;padding:10px 0;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-bottom-color:var(--live)}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:28px 0 10px}
label.who{display:block;font-weight:700;margin-bottom:14px}
select,input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;background:var(--ink);color:var(--bg);cursor:pointer}
.hint{color:var(--sub);font-size:13px;margin:4px 0}

.group{border-left:4px solid var(--event);padding-left:12px;margin:18px 0}
.group-head{font-weight:700;color:var(--event)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.day-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.day-top .d{font-weight:800;font-size:16px}
.memo{color:var(--sub);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.tag.k-生放送{background:var(--live);border-color:var(--live);color:#fff}
.tag.k-イベント{border-color:var(--event);color:var(--event)}
.tag.k-準備{border-color:var(--prep);color:var(--prep)}

.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pick);border-color:var(--pick);color:#fff}
.seg button.on.t-出席{background:var(--ok);border-color:var(--ok)}
.seg button.on.t-遅刻{background:var(--late);border-color:var(--late)}
.seg button.on.t-欠席,.seg button.on.t-来られない{background:var(--no);border-color:var(--no)}
.seg button.on.t-未定{background:var(--tbd);border-color:var(--tbd)}
.seg.two{grid-template-columns:repeat(2,1fr);width:150px;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--event);outline-offset:2px}

#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chips button{flex:none;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.k-生放送{border-color:var(--live)}
.chips button.k-イベント{border-color:var(--event)}
.count{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;margin:10px 0}
.count .warn{color:var(--live)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.names span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--sub)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);text-align:left;font-weight:700}
td.yes{color:var(--ok);font-weight:800} td.nope{color:var(--no)} td.none{color:var(--tbd)}
th.k-イベント{color:var(--event)} th.k-生放送{color:var(--live)}
tr.total td{font-weight:800;border-bottom:0}
.warn{color:var(--live);font-weight:700}
.empty{color:var(--sub);padding:12px 0}
</style>
</head>
<body>
<header>
  <h1>放送研究会 出欠</h1>
  <nav>
    <button data-tab="me" class="on">出欠を回答</button>
    <button data-tab="admin">役職者</button>
  </nav>
</header>

<main>
  <section id="me">
    <label class="who">自分の名前
      <select id="who"><option value="">読み込み中…</option></select>
    </label>
    <div id="myDays"></div>
  </section>

  <section id="admin" hidden>
    <div id="login">
      <label class="who">管理パスワード
        <input type="password" id="pw" autocomplete="current-password">
      </label>
      <button class="btn" id="loginBtn">開く</button>
    </div>
    <div id="adminBody" hidden>
      <h2>日付ごとの出欠</h2>
      <div id="dateChips" class="chips"></div>
      <div id="dayDetail"></div>
      <h2>イベント準備期間</h2>
      <div id="events"></div>
      <h2>出席率と未回答</h2>
      <p class="hint">未回答は今日から2週間分の数です。</p>
      <div id="stats"></div>
    </div>
  </section>
</main>

<div id="bar" hidden>
  <span id="barMsg"></span>
  <button class="btn" id="saveBtn">保存する</button>
</div>
<div id="toast"></div>

<script>
// ↓↓ Apps Script のウェブアプリURL（/exec で終わるもの）をここに貼る ↓↓
const API = 'https://script.google.com/macros/s/AKfycbxkwcNE8eTX7QKw-hG1AuJR7XlmjkAiJDisClwkgDQUePgb3qUZHlup8FtlqS7dcrWTWA/exec';
</script>
<script>
// 日の種類ごとの選択肢。multi は複数選べる、solo は選ぶと他が外れる
const OPT = {
  '部会':   { multi: ['PSH','部会','遅刻'], solo: ['欠席','未定'] },
  '生放送': { multi: [], solo: ['出席','遅刻','欠席','未定'] },
  'イベント': { multi: [], solo: ['出席','欠席'] },
  '準備':   { multi: ['1コマ','2コマ','3コマ','4コマ','5コマ','5コマ以降'], solo: ['来られない'] }
};
const NOT_COMING = ['欠席','来られない','未定'];
const SHORT = {'出席':'○','遅刻':'△','欠席':'×','未定':'?','PSH':'P','部会':'部',
  '1コマ':'1','2コマ':'2','3コマ':'3','4コマ':'4','5コマ':'5','5コマ以降':'5〜','来られない':'×'};
const W = '日月火水木金土';
let init = null, mine = {}, dirty = {}, admin = null, pw = '', selDate = '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parts = p => p ? p.split(',') : [];
const optsOf = kind => OPT[kind] || OPT['部会'];
function fmt(k){ const [y,m,d] = k.split('-').map(Number); return m + '/' + d + '(' + W[new Date(y,m-1,d).getDay()] + ')'; }
function addDays(k,n){ const [y,m,d] = k.split('-').map(Number); const t = new Date(y,m-1,d+n);
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
// サーバー（Apps Script）とのやりとり
const ARGS = { saveMine: ['name','map'], getAdmin: ['pw'], setActual: ['pw','date','name','actual'] };
function run(fn, ...args){
  const body = { action: fn };
  ARGS[fn].forEach((k, i) => body[k] = args[i]);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
function todayKey(){ const t = new Date(); return addDays(t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'), 0); }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
function getSaved(){ try { return localStorage.getItem('who') || ''; } catch(e){ return ''; } }
function setSaved(v){ try { localStorage.setItem('who', v); } catch(e){} }

// 選択肢をタップしたときの新しい値
function toggle(kind, cur, t){
  const o = optsOf(kind);
  let set = parts(cur);
  if (o.solo.includes(t)) return set.length === 1 && set[0] === t ? '' : t;
  set = set.filter(x => !o.solo.includes(x));
  set = set.includes(t) ? set.filter(x => x !== t) : set.concat(t);
  return o.multi.filter(x => set.includes(x)).join(',');
}

// ---------- タブ ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  $('me').hidden = b.dataset.tab !== 'me';
  $('admin').hidden = b.dataset.tab !== 'admin';
  $('bar').hidden = b.dataset.tab !== 'me' || !Object.keys(dirty).length;
});

// ---------- 部員：回答 ----------
// 前回のデータをすぐ表示して、裏で最新に入れ替える（2回目以降は待ちなし）
let BOOT = null;
function mineOf(name){
  const m = {};
  if (!name || !BOOT) return m;
  Object.keys(BOOT.plans).forEach(k => {
    const i = k.indexOf('|');
    if (k.slice(i + 1) === name) m[k.slice(0, i)] = BOOT.plans[k];
  });
  return m;
}
function saveBoot(){ try { localStorage.setItem('boot', JSON.stringify(BOOT)); } catch(e){} }
function applyBoot(b){
  const today = todayKey();
  BOOT = b;
  init = { today: today, members: b.members, days: b.days.filter(d => d.date >= today) };
  const cur = $('who').value || getSaved();
  $('who').innerHTML = '<option value="">選んでください</option>' +
    b.members.map(n => '<option>' + esc(n) + '</option>').join('');
  if (cur && b.members.includes(cur)) $('who').value = cur;
  mine = mineOf($('who').value);
  Object.keys(dirty).forEach(k => { if (dirty[k] === (mine[k] || '')) delete dirty[k]; });
  updateBar(); renderMine();
}
(() => {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('boot') || 'null'); } catch(e){}
  if (cached) applyBoot(cached);
  else $('myDays').innerHTML = '<p class="empty">読み込み中…</p>';
  if (API.indexOf('http') !== 0) { $('myDays').innerHTML = '<p class="empty">index.html にAPIのURLが入っていません。</p>'; return; }
  fetch(API + '?action=boot').then(r => r.json()).then(j => {
    if (!j.ok) throw new Error(j.error);
    applyBoot(j.data); saveBoot();
  }).catch(e => { if (!cached) $('myDays').innerHTML = '<p class="empty">読み込めませんでした：' + esc(e.message) + '</p>'; });
})();

$('who').onchange = () => {
  if (Object.keys(dirty).length && !confirm('保存していない変更があります。名前を切り替えますか？')) return;
  dirty = {}; updateBar();
  setSaved($('who').value);
  mine = mineOf($('who').value);
  renderMine();
};

function renderMine(){
  const box = $('myDays');
  if (!init) { box.innerHTML = '<p class="empty">読み込み中…</p>'; return; }
  if (!$('who').value) { box.innerHTML = '<p class="empty">名前を選ぶと、これからの活動日が出ます。</p>'; return; }
  if (!init.days.length) { box.innerHTML = '<p class="empty">これからの活動日はまだ登録されていません。</p>'; return; }
  let html = '', group = null;
  init.days.forEach(d => {
    if (d.prepFor !== group) {
      if (group) html += '</div>';
      group = d.prepFor;
      if (group) html += '<div class="group"><div class="group-head">' + esc(group) + ' に向けて</div>' +
        '<p class="hint">準備の日は、来られるコマをすべて選んでください。</p>';
    }
    const cur = parts(d.date in dirty ? dirty[d.date] : (mine[d.date] || ''));
    const o = optsOf(d.kind);
    html += '<div class="day"><div class="day-top"><span class="d">' + fmt(d.date) + '</span>' +
      '<span class="tag k-' + d.kind + '">' + d.kind + '</span>' +
      (d.memo ? '<span class="memo">' + esc(d.memo) + '</span>' : '') + '</div><div class="seg">' +
      o.multi.concat(o.solo).map(t => '<button class="t-' + t + (cur.includes(t) ? ' on' : '') +
        '" data-d="' + d.date + '" data-k="' + d.kind + '" data-t="' + t + '">' + t + '</button>').join('') +
      '</div></div>';
  });
  if (group) html += '</div>';
  box.innerHTML = html;
}

$('myDays').onclick = e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  const k = b.dataset.d;
  const cur = k in dirty ? dirty[k] : (mine[k] || '');
  dirty[k] = toggle(b.dataset.k, cur, b.dataset.t);
  if (dirty[k] === (mine[k] || '')) delete dirty[k];
  renderMine(); updateBar();
};

function updateBar(){
  const n = Object.keys(dirty).length;
  $('barMsg').textContent = n + '日分を変更中';
  $('bar').hidden = !n;
}

$('saveBtn').onclick = () => {
  const b = $('saveBtn'); b.disabled = true; b.textContent = '保存中…';
  const sending = Object.assign({}, dirty);
  run('saveMine', $('who').value, sending).then(() => {
    Object.assign(mine, sending);
    Object.keys(sending).forEach(k => { BOOT.plans[k + '|' + $('who').value] = sending[k]; });
    saveBoot();
    Object.keys(sending).forEach(k => { if (dirty[k] === sending[k]) delete dirty[k]; });
    updateBar(); renderMine(); toast('保存しました');
  }).catch(e => toast('保存できませんでした：' + e.message))
    .finally(() => { b.disabled = false; b.textContent = '保存する'; });
};

// ---------- 役職者 ----------
$('loginBtn').onclick = () => {
  pw = $('pw').value;
  $('loginBtn').textContent = '確認中…';
  run('getAdmin', pw).then(d => {
    admin = d; $('login').hidden = true; $('adminBody').hidden = false;
    const next = d.days.find(x => x.date >= d.today && x.kind !== '準備');
    selDate = next ? next.date : '';
    renderAdmin();
  }).catch(e => toast(e.message)).finally(() => $('loginBtn').textContent = '開く');
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };

const ans = (date, name) => admin.answers[date + '|' + name] || {plan:'', actual:''};

function renderAdmin(){ renderChips(); renderDay(); renderEvents(); renderStats(); }

function renderChips(){
  const from = addDays(admin.today, -14);
  const list = admin.days.filter(d => d.date >= from && d.kind !== '準備');
  $('dateChips').innerHTML = list.map(d =>
    '<button class="k-' + d.kind + (d.date === selDate ? ' on' : '') + '" data-d="' + d.date + '">' + fmt(d.date) + ' ' + d.kind + '</button>').join('');
  const on = $('dateChips').querySelector('.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
}
$('dateChips').onclick = e => { const b = e.target.closest('button'); if (!b) return; selDate = b.dataset.d; renderChips(); renderDay(); };

function renderDay(){
  const box = $('dayDetail');
  if (!selDate) { box.innerHTML = '<p class="empty">活動日がありません。</p>'; return; }
  const day = admin.days.find(d => d.date === selDate);
  const o = optsOf(day.kind);
  const cats = o.multi.concat(o.solo);
  const by = {}; cats.forEach(c => by[c] = []); const none = [];
  admin.members.forEach(n => {
    const p = parts(ans(selDate, n).plan);
    if (!p.length) none.push(n);
    p.forEach(t => { if (by[t]) by[t].push(n); });
  });
  let html = '<div class="count">' + cats.map(c => '<span>' + c + ' ' + by[c].length + '</span>').join('') +
    '<span class="warn">未回答 ' + none.length + '</span></div>';
  if (day.memo) html += '<p class="hint">' + esc(day.memo) + '</p>';

  if (selDate > admin.today) {
    cats.concat('未回答').forEach(c => {
      const list = c === '未回答' ? none : by[c];
      if (!list.length) return;
      html += '<b>' + c + '</b><div class="names">' + list.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>';
    });
  } else {
    html += '<p class="hint">実際に来たかどうかをつけられます（もう一度押すと取り消し）。</p>';
    admin.members.forEach(n => {
      const a = ans(selDate, n);
      html += '<div class="row"><span>' + esc(n) + '<small>予定：' + (a.plan ? esc(a.plan.replace(/,/g, '・')) : '未回答') + '</small></span><div class="seg two">' +
        ['出席','欠席'].map(s => '<button class="t-' + s + (a.actual === s ? ' on' : '') + '" data-n="' + esc(n) + '" data-s="' + s + '">' + s + '</button>').join('') +
        '</div></div>';
    });
  }
  box.innerHTML = html;
}

// 先に画面を変えて、裏で保存する（待ち時間を感じにくくする）
$('dayDetail').onclick = e => {
  const b = e.target.closest('button[data-n]'); if (!b) return;
  const date = selDate, name = b.dataset.n, a = ans(date, name);
  const before = a.actual;
  const val = before === b.dataset.s ? '' : b.dataset.s;
  admin.answers[date + '|' + name] = {plan: a.plan, actual: val};
  renderDay();
  run('setActual', pw, date, name, val).catch(err => {
    admin.answers[date + '|' + name] = {plan: a.plan, actual: before};
    if (selDate === date) renderDay();
    toast('記録できませんでした：' + err.message);
  });
};

function cell(p){
  const ps = parts(p);
  if (!ps.length) return '<td class="none">–</td>';
  const cls = ps.some(t => NOT_COMING.includes(t)) ? 'nope' : 'yes';
  return '<td class="' + cls + '">' + ps.map(t => SHORT[t] || t).join(' ') + '</td>';
}
const canCome = p => { const ps = parts(p); return ps.length && !ps.some(t => NOT_COMING.includes(t)); };

function renderEvents(){
  const evs = admin.days.filter(d => d.kind === 'イベント' && d.date >= admin.today);
  if (!evs.length) { $('events').innerHTML = '<p class="empty">これからのイベントは登録されていません。</p>'; return; }
  $('events').innerHTML = evs.map(ev => {
    const from = addDays(ev.date, -14);
    const cols = admin.days.filter(d => d.prepFor === ev.prepFor && d.date >= from && d.date <= ev.date);
    let t = '<p><b>' + esc(ev.prepFor) + '</b>（本番 ' + fmt(ev.date) + '）</p><div class="scroll"><table><tr><th>名前</th>' +
      cols.map(c => '<th class="k-' + c.kind + '">' + fmt(c.date) + '</th>').join('') + '</tr>';
    admin.members.forEach(n => {
      t += '<tr><td>' + esc(n) + '</td>' + cols.map(c => cell(ans(c.date, n).plan)).join('') + '</tr>';
    });
    t += '<tr class="total"><td>来られる人数</td>' + cols.map(c => '<td>' + admin.members.filter(n => canCome(ans(c.date, n).plan)).length + '</td>').join('') + '</tr>';
    return t + '</table></div><p class="hint">数字は来られるコマ（5〜は5コマ以降）。P＝PSH、部＝部会、○出席、△遅刻、×来られない</p>';
  }).join('');
}

function renderStats(){
  const rows = admin.stats.slice().sort((a, b) => b.unanswered - a.unanswered || (a.rate ?? 101) - (b.rate ?? 101));
  $('stats').innerHTML = '<div class="scroll"><table style="width:100%"><tr><th>名前</th><th>出席率</th><th>未回答</th></tr>' +
    rows.map(s => '<tr><td>' + esc(s.name) + '</td><td' + (s.rate !== null && s.rate < 50 ? ' class="warn"' : '') + '>' +
      (s.rate === null ? '–' : s.rate + '%') + '</td><td' + (s.unanswered ? ' class="warn"' : '') + '>' + s.unanswered + '</td></tr>').join('') +
    '</table></div>';
}
</script>
</body>
</html>
