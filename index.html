<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放研ポータル</title>
<meta name="description" content="放送研究会の出欠と生放送の役職表はここから">
<meta property="og:title" content="放研ポータル">
<meta property="og:description" content="放送研究会の出欠と生放送の役職表はここから">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#18202C; --sub:#5C6778; --line:#D5DBE3;
  --live:#E0362C; --event:#5B43C9; --prep:#B97A0A; --pick:#2B5FB8;
  --ok:#1E8A5A; --late:#C27C0E; --no:#8A93A3; --tbd:#9AA3B2;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121722; --panel:#1B2230; --ink:#E7EBF2; --sub:#9AA5B8; --line:#2E3747;
    --live:#FF5A4E; --event:#9C87FF; --prep:#E3A73A; --pick:#6C9BEF;
    --ok:#45C08A; --late:#E8A43A; --no:#7E889A; --tbd:#6E788A;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.note{margin-top:8px;font-size:14px;padding:8px 10px}
.memos{margin:6px 0 14px;font-size:14px}
.memos div{padding:3px 0;border-bottom:1px dashed var(--line)}
.memos b{margin-right:8px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding-bottom:84px}
header{background:var(--ink);color:var(--bg);padding:14px 16px 0}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.04em}
header{padding:14px 16px}
header .bar-in{display:flex;align-items:center;gap:10px;min-height:28px}
#back{border:0;background:transparent;color:inherit;font:inherit;font-size:14px;font-weight:700;padding:4px 10px 4px 0;cursor:pointer;opacity:.85}
#viewTitle{font-size:14px;opacity:.7;font-weight:700}
.menu{display:grid;gap:10px;margin-top:6px}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;font:inherit;font-size:17px;font-weight:800;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.menu button small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.menu button::after{content:"›";font-size:22px;color:var(--sub)}
.badge{display:inline-block;background:var(--live);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.summary{display:grid;gap:8px;margin:4px 0 18px}
.sum{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pick);border-radius:10px;padding:10px 12px;font-size:14px}
.sum.live{border-left-color:var(--live)}
.sum b{display:block;font-size:12px;color:var(--sub);font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:28px 0 10px}
label.who{display:block;font-weight:700;margin-bottom:14px}
select,input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;background:var(--ink);color:var(--bg);cursor:pointer}
.hint{color:var(--sub);font-size:13px;margin:4px 0}

.group{border-left:4px solid var(--event);padding-left:12px;margin:18px 0}
.group-head{font-weight:700;color:var(--event)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.day-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.day-top .d{font-weight:800;font-size:16px}
.memo{color:var(--sub);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.tag.k-生放送{background:var(--live);border-color:var(--live);color:#fff}
.tag.k-イベント{border-color:var(--event);color:var(--event)}
.tag.k-準備{border-color:var(--prep);color:var(--prep)}

.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pick);border-color:var(--pick);color:#fff}
.seg button.on.t-出席{background:var(--ok);border-color:var(--ok)}
.seg button.on.t-遅刻{background:var(--late);border-color:var(--late)}
.seg button.on.t-欠席,.seg button.on.t-来られない{background:var(--no);border-color:var(--no)}
.seg button.on.t-未定{background:var(--tbd);border-color:var(--tbd)}
.seg.two{grid-template-columns:repeat(2,1fr);width:150px;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--event);outline-offset:2px}

#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chips button{flex:none;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.k-生放送{border-color:var(--live)}
.chips button.k-イベント{border-color:var(--event)}
.count{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;margin:10px 0}
.count .warn{color:var(--live)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.names span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--sub)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);text-align:left;font-weight:700}
td.yes{color:var(--ok);font-weight:800} td.nope{color:var(--no)} td.none{color:var(--tbd)}
th.k-イベント{color:var(--event)} th.k-生放送{color:var(--live)}
tr.total td{font-weight:800;border-bottom:0}
.warn{color:var(--live);font-weight:700}
.empty{color:var(--sub);padding:12px 0}
.lineup summary{cursor:pointer;color:var(--pick);font-weight:700;font-size:14px;margin-top:8px}
.lu{display:flex;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.lu b{min-width:58px} .lu small{color:var(--sub)}
mark{background:#FFE58A;color:#18202C;border-radius:4px;padding:0 3px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lrole small{display:block;color:var(--sub);font-size:12px}
.lsel{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lsel select{width:auto;min-width:96px;margin:0;padding:6px 8px;font-size:14px}
.lsel select.sub{border-style:dashed;color:var(--sub)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
td small{color:var(--sub);margin-left:3px}
</style>
</head>
<body>
<header>
  <div class="bar-in">
    <button id="back" hidden>‹ メニュー</button>
    <h1 id="brand">放研ポータル</h1>
    <span id="viewTitle"></span>
  </div>
</header>

<main>
  <section id="home">
    <label class="who">自分の名前
      <select id="who"><option value="">読み込み中…</option></select>
    </label>
    <div id="summary" class="summary"></div>
    <div class="menu">
      <button data-go="me">出欠を回答<span id="meBadge"></span></button>
      <button data-go="lineups">生放送の役職表</button>
      <button data-go="admin">役職者<small>パスワードが必要です</small></button>
    </div>
  </section>

  <section id="lineups" hidden>
    <div id="lineupList"></div>
  </section>

  <section id="me" hidden>
    <p class="hint" id="meWho"></p>
    <div id="myDays"></div>
  </section>

  <section id="admin" hidden>
    <div id="login">
      <label class="who">管理パスワード
        <input type="password" id="pw" autocomplete="current-password">
      </label>
      <button class="btn" id="loginBtn">開く</button>
    </div>
    <div id="adminBody" hidden>
      <h2>日付ごとの出欠</h2>
      <div id="dateChips" class="chips"></div>
      <div id="dayDetail"></div>
      <h2>イベント準備期間</h2>
      <div id="events"></div>
      <h2>出席率と未回答</h2>
      <p class="hint">未回答は今日から2週間分の数です。</p>
      <div id="stats"></div>
      <h2>生放送の役職</h2>
      <div id="liveChips" class="chips"></div>
      <div id="lineupEdit"></div>
      <h2>役職の経験</h2>
      <p class="hint">数字は担当した回数です。補佐は「補」として別に表示し、経験の回数には入れていません。出席率は、生放送で役職か補佐に入った回の割合です。</p>
      <div id="exp"></div>
    </div>
  </section>
</main>

<div id="bar" hidden>
  <span id="barMsg"></span>
  <button class="btn" id="saveBtn">保存する</button>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
// 日の種類ごとの選択肢。multi は複数選べる、solo は選ぶと他が外れる
const OPT = {
  '部会':   { multi: ['PSH','部会','遅刻'], solo: ['欠席','未定'] },
  '部会生放送': { multi: ['生放送','PSH','部会','遅刻'], solo: ['欠席','未定'] }, // 生放送がある水曜（時間順）
  '生放送': { multi: [], solo: [] }, // 生放送だけの日は回答なし
  'イベント': { multi: [], solo: ['出席','欠席'] },
  '準備':   { multi: ['1コマ','2コマ','3コマ','4コマ','5コマ','5コマ以降'], solo: ['来られない'] },
  '準備生放送': { multi: ['生放送','1コマ','2コマ','3コマ','4コマ','5コマ','5コマ以降'], solo: ['来られない'] }
};
const NOT_COMING = ['欠席','来られない','未定'];
const SHORT = {'生放送':'生','出席':'○','遅刻':'△','欠席':'×','未定':'?','PSH':'P','部会':'部',
  '1コマ':'1','2コマ':'2','3コマ':'3','4コマ':'4','5コマ':'5','5コマ以降':'5〜','来られない':'×'};
const W = '日月火水木金土';
let init = null, mine = {}, dirty = {}, myNotes = {}, dirtyNote = {}, admin = null, pw = '', selDate = '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parts = p => p ? p.split(',') : [];
const optsOf = kind => OPT[kind] || OPT['部会'];
// 生放送がある部会の日は専用の選択肢にする
const kindKey = d => !d.live ? d.kind : d.kind === '部会' ? '部会生放送' : d.kind === '準備' ? '準備生放送' : d.kind;
function fmt(k){ const [y,m,d] = k.split('-').map(Number); return m + '/' + d + '(' + W[new Date(y,m-1,d).getDay()] + ')'; }
function addDays(k,n){ const [y,m,d] = k.split('-').map(Number); const t = new Date(y,m-1,d+n);
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
// サーバー（Apps Script）とのやりとり
const ARGS = { saveMine: ['name','map','notes'], getAdmin: ['pw'], setActual: ['pw','date','name','actual'], setLineup: ['pw','date','items'] };
const API = (typeof window.API_URL === 'string') ? window.API_URL : '';
// 返事を読み取る。データ以外（エラーページなど）が返ってきたら中身の一部を見せる
function readJson(r){
  return r.text().then(t => {
    try { return JSON.parse(t); }
    catch(e){
      const msg = t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
      throw new Error('サーバーから想定外の返事（' + r.status + '）：' + msg);
    }
  });
}
function run(fn, ...args){
  const body = { action: fn };
  ARGS[fn].forEach((k, i) => body[k] = args[i]);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(readJson)
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
function todayKey(){ const t = new Date(); return addDays(t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'), 0); }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
function getSaved(){ try { return localStorage.getItem('who') || ''; } catch(e){ return ''; } }
function setSaved(v){ try { localStorage.setItem('who', v); } catch(e){} }

// 選択肢をタップしたときの新しい値
function toggle(kind, cur, t){
  const o = optsOf(kind);
  let set = parts(cur);
  if (o.solo.includes(t)) return set.length === 1 && set[0] === t ? '' : t;
  set = set.filter(x => !o.solo.includes(x));
  set = set.includes(t) ? set.filter(x => x !== t) : set.concat(t);
  return o.multi.filter(x => set.includes(x)).join(',');
}

// ---------- 画面の切り替え ----------
const VIEWS = { home: '', me: '出欠を回答', lineups: '生放送の役職表', admin: '役職者' };
let view = 'home';
function show(){
  view = (location.hash || '#home').slice(1);
  if (!(view in VIEWS)) view = 'home';
  Object.keys(VIEWS).forEach(v => $(v).hidden = v !== view);
  $('back').hidden = view === 'home';
  $('brand').hidden = view !== 'home';
  $('viewTitle').textContent = VIEWS[view];
  if (view === 'home') renderHome();
  if (view === 'lineups') renderLineups();
  if (view === 'me') renderMine();
  updateBar();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', show);
$('back').onclick = () => { location.hash = '#home'; };
document.querySelector('.menu').onclick = e => {
  const b = e.target.closest('button[data-go]'); if (b) location.hash = '#' + b.dataset.go;
};

// トップ：次の活動日と次の生放送
function renderHome(){
  const name = $('who').value, box = $('summary');
  $('meBadge').innerHTML = '';
  if (!init || !name) { box.innerHTML = init ? '<p class="hint">名前を選ぶと、次の予定と自分の役職が表示されます。</p>' : ''; return; }
  const ask = init.days.filter(d => d.kind !== '生放送');
  const next = ask[0];
  let html = '';
  if (next) {
    const a = mine[next.date];
    html += '<div class="sum"><b>次の活動日</b>' + fmt(next.date) + ' ' + next.kind + (next.live ? '・生放送' : '') + '　' +
      (a ? '回答：' + esc(a.replace(/,/g, '・')) : '<span class="warn">未回答</span>') + '</div>';
  }
  const live = init.days.find(d => d.live);
  if (live) {
    const rows = ((BOOT.lineups || {})[live.date] || []).filter(r => r.name === name);
    const txt = !((BOOT.lineups || {})[live.date] || []).length ? '役職はまだ決まっていません'
      : rows.length ? rows.map(r => esc(r.role) + (r.slot === '補佐' ? '（補佐）' : '')).join('・') : '役職なし';
    html += '<div class="sum live"><b>次の生放送</b>' + fmt(live.date) + '　' + txt + '</div>';
  }
  box.innerHTML = html;
  const soon = addDays(init.today, 14);
  const n = ask.filter(d => d.date <= soon && !mine[d.date]).length;
  if (n) $('meBadge').innerHTML = '<span class="badge">未回答 ' + n + '</span>';
}

// 生放送の役職表（一覧）
function renderLineups(){
  const box = $('lineupList');
  if (!init) { box.innerHTML = '<p class="empty">読み込み中…</p>'; return; }
  const lives = init.days.filter(d => d.live);
  if (!lives.length) { box.innerHTML = '<p class="empty">これからの生放送はまだ登録されていません。</p>'; return; }
  box.innerHTML = lives.map(d => '<div class="day"><div class="day-top"><span class="d">' + fmt(d.date) + '</span>' +
    '<span class="tag k-生放送">生放送</span>' + (d.memo ? '<span class="memo">' + esc(d.memo) + '</span>' : '') + '</div>' +
    lineupHtml((BOOT.lineups || {})[d.date] || [], BOOT.roles || [], $('who').value) + '</div>').join('');
}

// ---------- 部員：回答 ----------
// 前回のデータをすぐ表示して、裏で最新に入れ替える（2回目以降は待ちなし）
let BOOT = null;
function mineOf(name){
  const m = {};
  if (!name || !BOOT) return m;
  Object.keys(BOOT.plans).forEach(k => {
    const i = k.indexOf('|');
    if (k.slice(i + 1) === name) m[k.slice(0, i)] = BOOT.plans[k];
  });
  return m;
}
function saveBoot(){ try { localStorage.setItem('boot', JSON.stringify(BOOT)); } catch(e){} }
function notesOf(name){
  const m = {};
  if (!name || !BOOT || !BOOT.notes) return m;
  Object.keys(BOOT.notes).forEach(k => {
    const i = k.indexOf('|');
    if (k.slice(i + 1) === name) m[k.slice(0, i)] = BOOT.notes[k];
  });
  return m;
}
function applyBoot(b){
  const today = todayKey();
  BOOT = b;
  init = { today: today, members: b.members, days: b.days.filter(d => d.date >= today) };
  const cur = $('who').value || getSaved();
  $('who').innerHTML = '<option value="">選んでください</option>' +
    b.members.map(n => '<option>' + esc(n) + '</option>').join('');
  if (cur && b.members.includes(cur)) $('who').value = cur;
  mine = mineOf($('who').value); myNotes = notesOf($('who').value);
  Object.keys(dirty).forEach(k => { if (dirty[k] === (mine[k] || '')) delete dirty[k]; });
  Object.keys(dirtyNote).forEach(k => { if (dirtyNote[k] === (myNotes[k] || '')) delete dirtyNote[k]; });
  updateBar(); renderMine(); renderHome(); if (view === 'lineups') renderLineups();
}
(() => {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('boot') || 'null'); } catch(e){}
  if (cached) applyBoot(cached);
  else $('myDays').innerHTML = '<p class="empty">読み込み中…</p>';
  if (API.indexOf('http') !== 0) { $('myDays').innerHTML = '<p class="empty">config.js にURLが入っていません。</p>'; return; }
  fetch(API + '?action=boot').then(readJson).then(j => {
    if (!j.ok) throw new Error(j.error);
    applyBoot(j.data); saveBoot();
  }).catch(e => { if (!cached) $('myDays').innerHTML = '<p class="empty">読み込めませんでした：' + esc(e.message) + '</p>'; });
})();

$('who').onchange = () => {
  if ((Object.keys(dirty).length || Object.keys(dirtyNote).length) && !confirm('保存していない変更があります。名前を切り替えますか？')) return;
  dirty = {}; dirtyNote = {}; updateBar();
  setSaved($('who').value);
  mine = mineOf($('who').value); myNotes = notesOf($('who').value);
  renderMine(); renderHome();
};

// 役職表（見るだけ）
function lineupHtml(rows, roles, me){
  if (!rows.length) return '<p class="hint">まだ決まっていません。</p>';
  const nm = n => n === me ? '<mark>' + esc(n) + '</mark>' : esc(n);
  return roles.map(r => {
    const main = rows.filter(x => x.role === r.abbr && x.slot === '担当').map(x => nm(x.name));
    const sub = rows.filter(x => x.role === r.abbr && x.slot === '補佐').map(x => nm(x.name));
    if (!main.length && !sub.length) return '';
    return '<div class="lu"><b>' + esc(r.abbr) + '</b><span>' + (main.join('・') || '—') +
      (sub.length ? ' <small>（補佐：' + sub.join('・') + '）</small>' : '') + '</span></div>';
  }).join('');
}

function renderMine(){
  const box = $('myDays');
  $('meWho').textContent = $('who').value ? $('who').value + ' さんの予定' : '';
  if (!init) { box.innerHTML = '<p class="empty">読み込み中…</p>'; return; }
  if (!$('who').value) { box.innerHTML = '<p class="empty">メニューの画面で、先に自分の名前を選んでください。</p>'; return; }
  if (!init.days.length) { box.innerHTML = '<p class="empty">これからの活動日はまだ登録されていません。</p>'; return; }
  let html = '', group = null;
  init.days.forEach(d => {
    if (d.prepFor !== group) {
      if (group) html += '</div>';
      group = d.prepFor;
      if (group) html += '<div class="group"><div class="group-head">' + esc(group) + ' に向けて</div>' +
        '<p class="hint">準備の日は、来られるコマをすべて選んでください。</p>';
    }
    const cur = parts(d.date in dirty ? dirty[d.date] : (mine[d.date] || ''));
    const kk = kindKey(d);
    const o = optsOf(kk);
    const note = d.date in dirtyNote ? dirtyNote[d.date] : (myNotes[d.date] || '');
    html += '<div class="day"><div class="day-top"><span class="d">' + fmt(d.date) + '</span>' +
      '<span class="tag k-' + d.kind + '">' + d.kind + '</span>' +
      (d.live && d.kind !== '生放送' ? '<span class="tag k-生放送">生放送</span>' : '') +
      (d.memo ? '<span class="memo">' + esc(d.memo) + '</span>' : '') + '</div>' +
      (d.kind === '生放送' ? '<p class="hint">出欠の回答はいりません</p>' : '<div class="seg">' +
      o.multi.concat(o.solo).map(t => '<button class="t-' + t + (cur.includes(t) ? ' on' : '') +
        '" data-d="' + d.date + '" data-k="' + kk + '" data-t="' + t + '">' + t + '</button>').join('') +
      '</div><input class="note" data-d="' + d.date + '" maxlength="100" placeholder="メモ（例：部会に15分遅れます）" value="' + esc(note) + '">') +
      (d.live ? '<details class="lineup"><summary>この回の役職表を見る</summary>' +
        lineupHtml((BOOT.lineups || {})[d.date] || [], BOOT.roles || [], $('who').value) + '</details>' : '') +
      '</div>';
  });
  if (group) html += '</div>';
  box.innerHTML = html;
}

$('myDays').oninput = e => {
  const t = e.target; if (!t.classList.contains('note')) return;
  const k = t.dataset.d;
  dirtyNote[k] = t.value;
  if (dirtyNote[k] === (myNotes[k] || '')) delete dirtyNote[k];
  updateBar();
};

$('myDays').onclick = e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  const k = b.dataset.d;
  const cur = k in dirty ? dirty[k] : (mine[k] || '');
  dirty[k] = toggle(b.dataset.k, cur, b.dataset.t);
  if (dirty[k] === (mine[k] || '')) delete dirty[k];
  renderMine(); updateBar();
};

function updateBar(){
  const n = new Set(Object.keys(dirty).concat(Object.keys(dirtyNote))).size;
  $('barMsg').textContent = n + '日分を変更中';
  $('bar').hidden = !n || view !== 'me';
}

$('saveBtn').onclick = () => {
  const b = $('saveBtn'); b.disabled = true; b.textContent = '保存中…';
  const sending = Object.assign({}, dirty), sendNote = Object.assign({}, dirtyNote);
  const who = $('who').value;
  run('saveMine', who, sending, sendNote).then(() => {
    Object.assign(mine, sending); Object.assign(myNotes, sendNote);
    Object.keys(sending).forEach(k => { BOOT.plans[k + '|' + who] = sending[k]; });
    BOOT.notes = BOOT.notes || {};
    Object.keys(sendNote).forEach(k => { BOOT.notes[k + '|' + who] = sendNote[k]; });
    saveBoot();
    Object.keys(sending).forEach(k => { if (dirty[k] === sending[k]) delete dirty[k]; });
    Object.keys(sendNote).forEach(k => { if (dirtyNote[k] === sendNote[k]) delete dirtyNote[k]; });
    updateBar(); renderMine(); renderHome(); toast('保存しました');
  }).catch(e => toast('保存できませんでした：' + e.message))
    .finally(() => { b.disabled = false; b.textContent = '保存する'; });
};

// ---------- 役職者 ----------
$('loginBtn').onclick = () => {
  pw = $('pw').value;
  $('loginBtn').textContent = '確認中…';
  run('getAdmin', pw).then(d => {
    admin = d; $('login').hidden = true; $('adminBody').hidden = false;
    const next = d.days.find(x => x.date >= d.today && (x.kind === '部会' || x.kind === 'イベント'));
    selDate = next ? next.date : '';
    renderAdmin();
  }).catch(e => toast(e.message)).finally(() => $('loginBtn').textContent = '開く');
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };

const ans = (date, name) => admin.answers[date + '|' + name] || {plan:'', actual:''};

function renderAdmin(){
  renderChips(); renderDay(); renderEvents(); renderStats();
  const lives = admin.days.filter(d => d.live);
  const next = lives.find(d => d.date >= admin.today) || lives[lives.length - 1];
  liveSel = next ? next.date : '';
  loadEdit(); renderLive(); renderExp();
}

function renderChips(){
  const from = addDays(admin.today, -14);
  const list = admin.days.filter(d => d.date >= from && (d.kind === '部会' || d.kind === 'イベント'));
  $('dateChips').innerHTML = list.map(d =>
    '<button class="k-' + d.kind + (d.date === selDate ? ' on' : '') + '" data-d="' + d.date + '">' + fmt(d.date) + ' ' + d.kind + (d.live ? '・生放送' : '') + '</button>').join('');
  const on = $('dateChips').querySelector('.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
}
$('dateChips').onclick = e => { const b = e.target.closest('button'); if (!b) return; selDate = b.dataset.d; renderChips(); renderDay(); };

// メモの一覧（日付ごと）
function memosHtml(dates, withDate){
  const rows = [];
  dates.forEach(dt => admin.members.forEach(n => {
    const a = ans(dt, n);
    if (a.note) rows.push('<div>' + (withDate ? fmt(dt) + ' ' : '') + '<b>' + esc(n) + '</b>' + esc(a.note) + '</div>');
  }));
  return rows.length ? '<b>メモ</b><div class="memos">' + rows.join('') + '</div>' : '';
}

function renderDay(){
  const box = $('dayDetail');
  if (!selDate) { box.innerHTML = '<p class="empty">活動日がありません。</p>'; return; }
  const day = admin.days.find(d => d.date === selDate);
  const o = optsOf(kindKey(day));
  const cats = o.multi.concat(o.solo);
  const by = {}; cats.forEach(c => by[c] = []); const none = [];
  admin.members.forEach(n => {
    const p = parts(ans(selDate, n).plan);
    if (!p.length) none.push(n);
    p.forEach(t => { if (by[t]) by[t].push(n); });
  });
  let html = '<div class="count">' + cats.map(c => '<span>' + c + ' ' + by[c].length + '</span>').join('') +
    '<span class="warn">未回答 ' + none.length + '</span></div>';
  if (day.memo) html += '<p class="hint">' + esc(day.memo) + '</p>';

  if (selDate > admin.today) {
    cats.concat('未回答').forEach(c => {
      const list = c === '未回答' ? none : by[c];
      if (!list.length) return;
      html += '<b>' + c + '</b><div class="names">' + list.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>';
    });
    html += memosHtml([selDate], false);
  } else {
    html += '<p class="hint">実際に来たかどうかをつけられます（もう一度押すと取り消し）。</p>';
    admin.members.forEach(n => {
      const a = ans(selDate, n);
      html += '<div class="row"><span>' + esc(n) + '<small>予定：' + (a.plan ? esc(a.plan.replace(/,/g, '・')) : '未回答') + (a.note ? '／' + esc(a.note) : '') + '</small></span><div class="seg two">' +
        ['出席','欠席'].map(s => '<button class="t-' + s + (a.actual === s ? ' on' : '') + '" data-n="' + esc(n) + '" data-s="' + s + '">' + s + '</button>').join('') +
        '</div></div>';
    });
  }
  box.innerHTML = html;
}

// 先に画面を変えて、裏で保存する（待ち時間を感じにくくする）
$('dayDetail').onclick = e => {
  const b = e.target.closest('button[data-n]'); if (!b) return;
  const date = selDate, name = b.dataset.n, a = ans(date, name);
  const before = a.actual;
  const val = before === b.dataset.s ? '' : b.dataset.s;
  admin.answers[date + '|' + name] = {plan: a.plan, actual: val};
  renderDay();
  run('setActual', pw, date, name, val).catch(err => {
    admin.answers[date + '|' + name] = {plan: a.plan, actual: before};
    if (selDate === date) renderDay();
    toast('記録できませんでした：' + err.message);
  });
};

function cell(p){
  const ps = parts(p);
  if (!ps.length) return '<td class="none">–</td>';
  const cls = ps.some(t => NOT_COMING.includes(t)) ? 'nope' : 'yes';
  return '<td class="' + cls + '">' + ps.map(t => SHORT[t] || t).join(' ') + '</td>';
}
const canCome = p => { const ps = parts(p); return ps.length && !ps.some(t => NOT_COMING.includes(t)); };

function renderEvents(){
  const evs = admin.days.filter(d => d.kind === 'イベント' && d.date >= admin.today);
  if (!evs.length) { $('events').innerHTML = '<p class="empty">これからのイベントは登録されていません。</p>'; return; }
  $('events').innerHTML = evs.map(ev => {
    const from = addDays(ev.date, -14);
    const cols = admin.days.filter(d => d.prepFor === ev.prepFor && d.date >= from && d.date <= ev.date);
    let t = '<p><b>' + esc(ev.prepFor) + '</b>（本番 ' + fmt(ev.date) + '）</p><div class="scroll"><table><tr><th>名前</th>' +
      cols.map(c => '<th class="k-' + (c.live ? '生放送' : c.kind) + '">' + fmt(c.date) + (c.live ? '<br>生放送' : '') + '</th>').join('') + '</tr>';
    admin.members.forEach(n => {
      t += '<tr><td>' + esc(n) + '</td>' + cols.map(c => cell(ans(c.date, n).plan)).join('') + '</tr>';
    });
    t += '<tr class="total"><td>来られる人数</td>' + cols.map(c => '<td>' + admin.members.filter(n => canCome(ans(c.date, n).plan)).length + '</td>').join('') + '</tr>';
    return t + '</table></div><p class="hint">数字は来られるコマ（5〜は5コマ以降）。生＝生放送、P＝PSH、部＝部会、○出席、△遅刻、×来られない</p>' +
      memosHtml(cols.map(c => c.date), true);
  }).join('');
}

function renderStats(){
  const rows = admin.stats.slice().sort((a, b) => b.unanswered - a.unanswered || (a.rate ?? 101) - (b.rate ?? 101));
  $('stats').innerHTML = '<div class="scroll"><table style="width:100%"><tr><th>名前</th><th>出席率</th><th>未回答</th></tr>' +
    rows.map(s => '<tr><td>' + esc(s.name) + '</td><td' + (s.rate !== null && s.rate < 50 ? ' class="warn"' : '') + '>' +
      (s.rate === null ? '–' : s.rate + '%') + '</td><td' + (s.unanswered ? ' class="warn"' : '') + '>' + s.unanswered + '</td></tr>').join('') +
    '</table></div>';
}

// ---------- 生放送の役職 ----------
let liveSel = '', edit = {}, editDirty = false, showOpt = false;

function loadEdit(){
  edit = {};
  admin.lineups.filter(r => r.date === liveSel).forEach(r => {
    const e = edit[r.role] = edit[r.role] || { s: [], sub: '' };
    if (r.slot === '補佐') e.sub = r.name; else e.s.push(r.name);
  });
  editDirty = false;
  showOpt = admin.roles.some(r => r.optional && edit[r.abbr]);
}

function renderLive(){
  const lives = admin.days.filter(d => d.live);
  $('liveChips').innerHTML = lives.map(d =>
    '<button class="k-生放送' + (d.date === liveSel ? ' on' : '') + '" data-d="' + d.date + '">' + fmt(d.date) + '</button>').join('');
  const on = $('liveChips').querySelector('.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
  if (!liveSel) { $('lineupEdit').innerHTML = '<p class="empty">生放送の日が登録されていません。</p>'; return; }
  const opt = n => '<option' + (n ? '' : ' value=""') + '>' + esc(n) + '</option>';
  const sel = (role, slot, i, val, cls) => '<select class="' + cls + '" data-role="' + esc(role) + '" data-slot="' + slot + '" data-i="' + i + '">' +
    '<option value="">' + (slot === 'sub' ? '補佐なし' : '—') + '</option>' +
    admin.members.map(n => '<option' + (n === val ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>';
  let html = '';
  admin.roles.filter(r => !r.optional || showOpt || edit[r.abbr]).forEach(r => {
    const e = edit[r.abbr] || { s: [], sub: '' };
    let sels = '';
    for (let i = 0; i < r.max; i++) sels += sel(r.abbr, 's', i, e.s[i] || '', '');
    sels += sel(r.abbr, 'sub', 0, e.sub, 'sub');
    html += '<div class="lrow"><div class="lrole"><b>' + esc(r.abbr) + '</b><small>' + esc(r.name) + (r.optional ? '（任意）' : '') + '</small></div><div class="lsel">' + sels + '</div></div>';
  });
  const hasOpt = admin.roles.some(r => r.optional);
  html += '<div class="actions">' +
    (hasOpt ? '<button class="btn ghost" id="optBtn">' + (showOpt ? '任意の役職を隠す' : '任意の役職を表示') + '</button>' : '') +
    '<button class="btn" id="luSave"' + (editDirty ? '' : ' disabled') + '>この回の役職表を保存</button></div>';
  $('lineupEdit').innerHTML = html;
}

$('liveChips').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (editDirty && !confirm('保存していない役職表があります。切り替えますか？')) return;
  liveSel = b.dataset.d; loadEdit(); renderLive();
};

$('lineupEdit').onchange = e => {
  const t = e.target; if (!t.dataset.role) return;
  const e2 = edit[t.dataset.role] = edit[t.dataset.role] || { s: [], sub: '' };
  if (t.dataset.slot === 'sub') e2.sub = t.value; else e2.s[Number(t.dataset.i)] = t.value;
  editDirty = true;
  $('luSave').disabled = false;
};

$('lineupEdit').onclick = e => {
  if (e.target.id === 'optBtn') { showOpt = !showOpt; renderLive(); return; }
  if (e.target.id !== 'luSave') return;
  const items = [];
  Object.keys(edit).forEach(role => {
    edit[role].s.forEach(n => { if (n) items.push({ role: role, slot: '担当', name: n }); });
    if (edit[role].sub) items.push({ role: role, slot: '補佐', name: edit[role].sub });
  });
  const b = e.target; b.disabled = true; b.textContent = '保存中…';
  const date = liveSel;
  run('setLineup', pw, date, items).then(() => {
    admin.lineups = admin.lineups.filter(r => r.date !== date)
      .concat(items.map(it => ({ date: date, role: it.role, slot: it.slot, name: it.name })));
    if (liveSel === date) { editDirty = false; renderLive(); }
    renderExp(); toast('役職表を保存しました');
  }).catch(err => { b.disabled = false; b.textContent = 'この回の役職表を保存'; toast('保存できませんでした：' + err.message); });
};

function renderExp(){
  const past = new Set(admin.days.filter(d => d.live && d.date <= admin.today).map(d => d.date));
  const cnt = {}, sub = {}, came = {};
  admin.lineups.forEach(r => {
    if (!past.has(r.date)) return;
    const box = r.slot === '補佐' ? sub : cnt;
    box[r.name + '|' + r.role] = (box[r.name + '|' + r.role] || 0) + 1;
    (came[r.name] = came[r.name] || new Set()).add(r.date);
  });
  const roles = admin.roles;
  let t = '<div class="scroll"><table><tr><th>名前</th><th>出席率</th>' + roles.map(r => '<th>' + esc(r.abbr) + '</th>').join('') + '</tr>';
  admin.members.forEach(n => {
    const rate = past.size ? Math.round((came[n] ? came[n].size : 0) / past.size * 100) + '%' : '–';
    t += '<tr><td>' + esc(n) + '</td><td>' + rate + '</td>' + roles.map(r => {
      const c = cnt[n + '|' + r.abbr] || 0, sb = sub[n + '|' + r.abbr] || 0;
      if (!c && !sb) return '<td class="none">–</td>';
      return '<td' + (c ? ' class="yes"' : '') + '>' + (c || '') + (sb ? '<small>補' + sb + '</small>' : '') + '</td>';
    }).join('') + '</tr>';
  });
  $('exp').innerHTML = t + '</table></div>' + (past.size ? '' : '<p class="hint">まだ終わった生放送がありません。</p>');
}
show();
</script>
</body>
</html>
